syntax = "proto3";

package apexquant.common.v1;

import "google/protobuf/timestamp.proto";

enum ServicePlane {
  SERVICE_PLANE_UNSPECIFIED = 0;
  CONTROL = 1;
  MARKET_DATA = 2;
  TRADING = 3;
  RISK = 4;
  AI = 5;
  DATA_RESEARCH = 6;
  OBSERVABILITY = 7;
}

enum ServiceState {
  SERVICE_STATE_UNSPECIFIED = 0;
  STARTING = 1;
  READY = 2;
  DEGRADED = 3;
  STOPPING = 4;
  FAILED = 5;
}

enum FailClosedPolicy {
  FAIL_CLOSED_POLICY_UNSPECIFIED = 0;
  READ_ONLY = 1;
  CANCEL_OPEN_ORDERS = 2;
  HALT_TRADING = 3;
  SHUTDOWN = 4;
}

message ServiceEndpoint {
  string name = 1;
  string protocol = 2;
  string uri = 3;
  int32 port = 4;
}

message ServiceDescriptor {
  string service_id = 1;
  string service_name = 2;
  string version = 3;
  string environment = 4;
  ServicePlane plane = 5;
  FailClosedPolicy fail_closed_policy = 6;
  string description = 7;
  repeated string capabilities = 8;
  repeated string permissions = 9;
  repeated ServiceEndpoint endpoints = 10;
  repeated string dependencies = 11;
}

message RegisterServiceRequest {
  ServiceDescriptor descriptor = 1;
}

message RegisterServiceResponse {
  string registration_id = 1;
  google.protobuf.Timestamp registered_at = 2;
  ServiceState state = 3;
}

message HeartbeatRequest {
  string service_id = 1;
  ServiceState state = 2;
  google.protobuf.Timestamp observed_at = 3;
  string detail = 4;
}

message HeartbeatResponse {
  google.protobuf.Timestamp acknowledged_at = 1;
  ServiceState state = 2;
}

message GetServiceRequest {
  string service_id = 1;
}

message GetServiceResponse {
  ServiceDescriptor service = 1;
}

message ListServicesRequest {
  string environment = 1;
  ServicePlane plane = 2;
  int64 limit = 3;
  int64 offset = 4;
}

message ListServicesResponse {
  repeated ServiceDescriptor services = 1;
  int64 total = 2;
}

service ServiceFramework {
  rpc RegisterService(RegisterServiceRequest) returns (RegisterServiceResponse);
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
  rpc GetService(GetServiceRequest) returns (GetServiceResponse);
  rpc ListServices(ListServicesRequest) returns (ListServicesResponse);
}