global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'default-webhook'

receivers:
  - name: 'default-webhook'
    webhook_configs:
      - url: 'http://logging-core:8088/v1/logs'
        send_resolved: true
        http_config:
          follow_redirects: true