services:
  feature-flags-core:
    build:
      context: ../../../../
      dockerfile: infra/docker/dockerfiles/Dockerfile.feature-flags-core
    image: ${FEATURE_FLAGS_CORE_IMAGE:-apexquant/feature-flags-core}:${FEATURE_FLAGS_CORE_VERSION:-0.22.0}
    environment:
      APEX_FEATURE_FLAGS_HTTP_ADDR: 0.0.0.0:8091
      APEX_FEATURE_FLAGS_ENVIRONMENT: ${APEX_ENVIRONMENT:-local}
      APEX_FEATURE_FLAGS_DATABASE_URL: postgres://${POSTGRES_USER:-apex}:${POSTGRES_PASSWORD:-apex}@postgres:5432/${POSTGRES_DB:-apexquant}
      APEX_FEATURE_FLAGS_MIGRATIONS_DIR: /migrations/postgres/feature_flags
      APEX_FEATURE_FLAGS_MIGRATE_ON_START: "true"
    ports:
      - "8091:8091"
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    user: "10001"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    labels:
      apexquant.managed: "true"
      apexquant.service.name: feature-flags-core
      apexquant.service.plane: CONTROL
      apexquant.environment: ${APEX_ENVIRONMENT:-local}
      apexquant.feature: "0.22"
      apexquant.version: ${FEATURE_FLAGS_CORE_VERSION:-0.22.0}
      apexquant.fail_closed_policy: READ_ONLY
    networks:
      - platform
      - data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8091/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
