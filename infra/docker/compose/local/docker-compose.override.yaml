services:
  postgres:
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_buffers=256MB
      - -c
      - wal_level=logical
      - -c
      - track_commit_timestamp=on
      - -c
      - log_statement=ddl
      - -c
      - log_min_duration_statement=250
      - -c
      - password_encryption=scram-sha-256

  database-infrastructure-core:
    build:
      context: ../../../../
      dockerfile: infra/docker/dockerfiles/Dockerfile.database-infrastructure
    image: ${DATABASE_INFRASTRUCTURE_IMAGE:-apexquant/database-infrastructure-core}:${DATABASE_INFRASTRUCTURE_VERSION:-0.6.0}
    environment:
      APEX_HTTP_ADDR: 0.0.0.0:8081
      APEX_DATABASE_URL: postgres://${POSTGRES_USER:-apex}:${POSTGRES_PASSWORD:-apex}@postgres:5432/${POSTGRES_DB:-apexquant}
      APEX_ENVIRONMENT: ${APEX_ENVIRONMENT:-local}
      APEX_DB_INSTANCE_NAME: apexquant-local
      APEX_SERVICE_NAME: database-infrastructure-core
      APEX_SERVICE_VERSION: ${DATABASE_INFRASTRUCTURE_VERSION:-0.6.0}
      APEX_MAX_DB_CONNECTIONS: "10"
      RUST_LOG: info
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    user: "10001"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    labels:
      apexquant.managed: "true"
      apexquant.service.name: database-infrastructure-core
      apexquant.service.plane: CONTROL
      apexquant.environment: ${APEX_ENVIRONMENT:-local}
      apexquant.feature: "0.6"
      apexquant.version: ${DATABASE_INFRASTRUCTURE_VERSION:-0.6.0}
      apexquant.fail_closed_policy: SHUTDOWN
    networks:
      - platform
      - data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8081/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M

  secrets-manager:
    build:
      context: ../../../../
      dockerfile: infra/docker/dockerfiles/Dockerfile.secrets-manager
    image: ${SECRETS_MANAGER_IMAGE:-apexquant/secrets-manager}:${SECRETS_MANAGER_VERSION:-0.5.0}
    profiles:
      - tools
    environment:
      APEX_SECRETS_STORE_PATH: /secrets/local.apexsecrets
      APEX_SECRETS_AUDIT_PATH: /audit/secrets-audit.jsonl
    volumes:
      - secrets-data:/secrets
      - audit-data:/audit
    read_only: true
    tmpfs:
      - /tmp
    user: "10001"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    labels:
      apexquant.managed: "true"
      apexquant.service.name: secrets-manager
      apexquant.service.plane: CONTROL
      apexquant.environment: ${APEX_ENVIRONMENT:-local}
      apexquant.feature: "0.5"
      apexquant.version: ${SECRETS_MANAGER_VERSION:-0.5.0}
      apexquant.fail_closed_policy: SHUTDOWN
      apexquant.container.healthcheck_exempt: "true"
    networks:
      - platform
    command:
      - --help
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M

  redis:
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - noeviction
      - --save
      - "900 1"
      - --save
      - "300 10"
      - --save
      - "60 10000"
    volumes:
      - redis-data:/data
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M


  storage-bootstrap:
    build:
      context: ../../../../
      dockerfile: infra/docker/dockerfiles/Dockerfile.python-service
      args:
        PACKAGE_PATH: python/apexquant-s3
        SERVICE_MODULE: apexquant_s3.cli
    image: ${STORAGE_BOOTSTRAP_IMAGE:-apexquant/storage-bootstrap}:${STORAGE_BOOTSTRAP_VERSION:-0.9.0}
    environment:
      APEX_S3_ENDPOINT_URL: http://minio:9000
      APEX_S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-apex}
      APEX_S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-apexquant-minio}
      APEX_S3_REGION: us-east-1
      APEX_S3_FORCE_PATH_STYLE: "true"
      APEX_ENVIRONMENT: ${APEX_ENVIRONMENT:-local}
      APEX_DATABASE_URL: postgres://${POSTGRES_USER:-apex}:${POSTGRES_PASSWORD:-apex}@postgres:5432/${POSTGRES_DB:-apexquant}
    depends_on:
      minio:
        condition: service_healthy
      postgres:
        condition: service_healthy
    entrypoint: ["python", "-m", "apexquant_s3.cli"]
    command: ["bootstrap", "--environment", "${APEX_ENVIRONMENT:-local}", "--database-url", "postgres://${POSTGRES_USER:-apex}:${POSTGRES_PASSWORD:-apex}@postgres:5432/${POSTGRES_DB:-apexquant}"]
    networks:
      - platform
      - data
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M

volumes:
  secrets-data:
  audit-data:
  redis-data: