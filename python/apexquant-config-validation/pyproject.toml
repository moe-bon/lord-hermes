[project]
name = "apexquant-config-validation"
version = "0.23.0"
description = "ApexQuant Ultra configuration validation framework"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "jsonschema>=4.23",
    "PyYAML>=6.0",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "mypy>=1.11",
    "ruff>=0.6",
]

[project.scripts]
apexquant-config = "apexquant_config_validation.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apexquant_config_validation"]

[tool.hatch.build.targets.wheel.force-include]
"../../data/config/validation_policy.yaml" = "apexquant_config_validation/data/validation_policy.yaml"
"../../data/schemas/config" = "apexquant_config_validation/data/schemas"

[tool.mypy]
python_version = "3.13"
strict = true

[tool.ruff]
line-length = 100
target-version = "py313"