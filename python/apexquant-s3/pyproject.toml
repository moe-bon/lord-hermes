[project]
name = "apexquant-s3"
version = "0.9.0"
description = "ApexQuant Ultra object storage infrastructure foundation"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.34",
    "botocore>=1.34",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "moto[s3]>=5.0",
    "mypy>=1.11",
    "ruff>=0.6",
    "boto3-stubs[s3]>=1.34",
]

[project.scripts]
apexquant-s3 = "apexquant_s3.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apexquant_s3"]

[tool.mypy]
python_version = "3.13"
strict = true

[tool.ruff]
line-length = 100
target-version = "py313"