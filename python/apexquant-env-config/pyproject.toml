[project]
name = "apexquant-env-config"
version = "0.4.0"
description = "ApexQuant Ultra environment and configuration management"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.8",
    "PyYAML>=6.0.1",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "mypy>=1.11",
    "ruff>=0.6",
]

[project.scripts]
apexquant-env-config = "apexquant_env_config.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apexquant_env_config"]

[tool.mypy]
python_version = "3.13"
strict = true

[tool.ruff]
line-length = 100
target-version = "py313"