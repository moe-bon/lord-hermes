[project]
name = "apexquant-redis"
version = "0.7.0"
description = "ApexQuant Ultra Redis infrastructure foundation"
requires-python = ">=3.13"
dependencies = [
    "redis[hiredis]>=5.0",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "fakeredis[lua]>=2.23",
    "mypy>=1.11",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apexquant_redis"]

[tool.mypy]
python_version = "3.13"
strict = true

[tool.ruff]
line-length = 100
target-version = "py313"