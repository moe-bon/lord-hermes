[project]
name = "apexquant-secrets"
version = "0.5.0"
description = "ApexQuant Ultra secrets and key management foundation"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.8",
    "cryptography>=43",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "mypy>=1.11",
    "ruff>=0.6",
]

[project.scripts]
apexquant-secrets = "apexquant_secrets.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apexquant_secrets"]

[tool.mypy]
python_version = "3.13"
strict = true

[tool.ruff]
line-length = 100
target-version = "py313"

python/apexquant-secrets/src/apexquant_secrets/__init__.py