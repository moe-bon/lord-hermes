[project]
name = "apexquant-flags"
version = "0.22.0"
description = "ApexQuant Ultra feature flag SDK (OpenFeature-compatible, conformant)"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "xxhash>=3.4",
    "redis>=5.0",
    "psycopg[binary]>=3.2",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "mypy>=1.11",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apexquant_flags"]

[tool.hatch.build.targets.wheel.force-include]
"../../data/feature_flags/determinism.yaml" = "apexquant_flags/data/determinism.yaml"

[tool.mypy]
python_version = "3.13"
strict = true

[tool.ruff]
line-length = 100
target-version = "py313"