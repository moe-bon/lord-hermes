[project]
name = "apexquant-testing"
version = "0.19.0"
description = "ApexQuant Ultra automated testing framework"
requires-python = ">=3.13"
dependencies = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "hypothesis>=6",
    "pydantic>=2.8",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.11",
    "ruff>=0.6",
]

[project.scripts]
apexquant-test-runner = "apexquant_testing.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apexquant_testing"]

[tool.mypy]
python_version = "3.13"
strict = true

[tool.ruff]
line-length = 100
target-version = "py313"