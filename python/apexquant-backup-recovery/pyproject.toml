[project]
name = "apexquant-backup-recovery"
version = "0.24.0"
description = "ApexQuant Ultra backup and recovery infrastructure"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "boto3>=1.34",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "mypy>=1.11",
    "ruff>=0.6",
]

[project.scripts]
apexquant-backup-recovery = "apexquant_backup_recovery.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apexquant_backup_recovery"]

[tool.mypy]
python_version = "3.13"
strict = true

[tool.ruff]
line-length = 100
target-version = "py313"