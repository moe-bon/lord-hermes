[project]
name = "apexquant-metrics"
version = "0.15.0"
description = "ApexQuant Ultra metrics infrastructure and governance"
requires-python = ">=3.13"
dependencies = [
    "prometheus-client>=0.20",
    "fastapi>=0.115",
    "starlette>=0.38",
    "pydantic>=2.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "mypy>=1.11",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apexquant_metrics"]

[tool.mypy]
python_version = "3.13"
strict = true

[tool.ruff]
line-length = 100
target-version = "py313"