[project]
name = "apexquant-repo-architecture"
version = "0.1.0"
description = "ApexQuant Ultra repository architecture verification"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.8",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "mypy>=1.11",
    "ruff>=0.6",
]

[project.scripts]
apexquant-repo-verify = "apexquant_repo_architecture.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apexquant_repo_architecture"]

[tool.mypy]
python_version = "3.13"
strict = true

[tool.ruff]
line-length = 100
target-version = "py313"