name: Configuration Validation

on:
  push:
    branches:
      - main
    paths:
      - 'config/**'
      - 'data/config/**'
      - 'data/schemas/config/**'
      - 'python/apexquant-config-validation/**'
      - 'crates/common/apex-config-validation/**'
      - '.github/workflows/config-validation.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'config/**'
      - 'data/config/**'
      - 'data/schemas/config/**'
      - 'python/apexquant-config-validation/**'
      - 'crates/common/apex-config-validation/**'
      - '.github/workflows/config-validation.yml'

jobs:
  python-config-validation-tests:
    name: Python Config Validation Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Run Python tests
        run: |
          cd python/apexquant-config-validation
          uv sync --all-extras
          uv run pytest --tb=short -q

  rust-config-validation-tests:
    name: Rust Config Validation Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.81.0

      - name: Run Rust tests
        run: cargo test -p apex-config-validation

  validate-repository-configs:
    name: Validate Repository Config Documents
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Validate all config documents
        run: ./scripts/config/validate-all.sh