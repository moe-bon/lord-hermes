name: Structured Logging

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  python-logging-tests:
    name: Python Logging Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Run logging tests
        run: |
          cd python/apexquant-logging
          uv sync --all-extras
          uv run pytest

  rust-logging-tests:
    name: Rust Logging Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.81.0

      - name: Run apex-logging tests
        run: cargo test --package apex-logging