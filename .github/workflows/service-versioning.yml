name: Service Versioning

on:
  push:
    branches:
      - main
    paths:
      - 'python/apexquant-service-versioning/**'
      - 'migrations/postgres/service_versioning/**'
      - '.github/workflows/service-versioning.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'python/apexquant-service-versioning/**'
      - 'migrations/postgres/service_versioning/**'
      - '.github/workflows/service-versioning.yml'

jobs:
  service-versioning-tests:
    name: Service Versioning Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Run service versioning tests
        run: |
          cd python/apexquant-service-versioning
          uv sync --all-extras
          uv run pytest --tb=short -q