name: Event Bus

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  python-event-bus-tests:
    name: Python Event Bus Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Run event bus tests
        run: |
          cd python/apexquant-event-bus
          uv sync --all-extras
          uv run pytest

  rust-event-contract-tests:
    name: Rust Event Contract Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.81.0

      - name: Run apex-events tests
        run: cargo test --package apex-events