name: Audit Trail

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  python-audit-tests:
    name: Python Audit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Run audit tests
        run: |
          cd python/apexquant-audit
          uv sync --all-extras
          uv run pytest

  rust-audit-tests:
    name: Rust Audit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.81.0

      - name: Run apex-audit tests
        run: cargo test --package apex-audit