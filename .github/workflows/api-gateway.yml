name: API Gateway

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  rust-api-gateway-tests:
    name: Rust API Gateway Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.81.0

      - name: Run api-gateway-core tests
        run: cargo test --package api-gateway-core

  python-api-framework-tests:
    name: Python API Framework Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Run API framework tests
        run: |
          cd python/apexquant-api-framework
          uv sync --all-extras
          uv run pytest