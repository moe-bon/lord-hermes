name: Authentication

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  rust-auth-tests:
    name: Rust Auth Token Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.81.0

      - name: Run apex-auth tests
        run: cargo test --package apex-auth

  python-auth-tests:
    name: Python Auth Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Run auth tests
        run: |
          cd python/apexquant-auth
          uv sync --all-extras
          uv run pytest