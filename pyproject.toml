[project]
name = "apexquant-ultra"
version = "0.1.0"
description = "ApexQuant Ultra monorepo"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = [
    "**/target",
    "**/node_modules",
    "**/.venv",
    "**/dist",
    "**/build",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "C4",
    "SIM",
    "TCH",
]
ignore = []

[tool.mypy]
python_version = "3.13"
strict = true
pretty = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true